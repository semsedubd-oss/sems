<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEMS Academy</title>
<meta name="theme-color" content="#0009b5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SEMS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0009b5;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f1f2fb;padding-top:env(safe-area-inset-top)}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Arial,sans-serif;background:linear-gradient(135deg,#000a8f,#3b4fe0);z-index:2;transition:opacity .4s}
#ld img{width:96px;height:96px;border-radius:22px}
#ld div{margin-top:14px;font-size:15px;opacity:.85}
#off{display:none;position:fixed;inset:0;z-index:3;background:#fff;color:#0009b5;font-family:Arial,sans-serif;text-align:center;padding:40px 24px}
</style>
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><div>SEMS Academy</div></div>
<div id="off"><h2>ইন্টারনেট সংযোগ নেই</h2><p>সংযোগ ফিরলে আবার চেষ্টা করুন।</p><button onclick="location.reload()" style="padding:10px 22px;font-size:16px;border:0;border-radius:10px;background:#0009b5;color:#fff">আবার চেষ্টা করুন</button></div>
<iframe id="app" title="SEMS Academy" allow="fullscreen; clipboard-write; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
/* ★ শুধু এই এক লাইনে আপনার Apps Script Web App এর /exec লিংক বসান ★ */
var APP_URL = 'https://script.google.com/macros/s/AKfycbyW5_Mg2YXg8LCvqxjEYunYY8SCEyQoJ__9yvzXUugpin5P1mtdb2tSDxfJ_SB6tW1IHA/exec';

(function () {
  var f = document.getElementById('app');
  function show() { document.getElementById('ld').style.opacity = 0; setTimeout(function () { document.getElementById('ld').style.display = 'none'; }, 450); }
  if (!navigator.onLine) document.getElementById('off').style.display = 'block';
  window.addEventListener('online', function () { location.reload(); });
  f.addEventListener('load', show);
  setTimeout(show, 8000);
  if (APP_URL.indexOf('https://') === 0) f.src = APP_URL;
  else document.getElementById('ld').lastChild.textContent = 'APP_URL বসানো হয়নি — index.html সম্পাদনা করুন';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
